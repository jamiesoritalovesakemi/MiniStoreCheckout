<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Store Checkout System</title>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>MINI STORE CHECKOUT SYSTEM</h1>
            <p>Simple and efficient order calculation system</p>
        </div>

        <div class="card">

            <h2 class="section-title">Customer Information</h2>

            <div class="form-group">
                <label for="customerName">Customer Name</label>
                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter customer name"
                >
            </div>

            <div class="form-group">
                <label for="productCount">Number of Products</label>
                <input
                    type="number"
                    id="productCount"
                    min="1"
                    step="1"
                    placeholder="Enter number of products"
                >
            </div>

            <div id="productsContainer"></div>

            <div class="form-group">
                <label for="deliveryOption">Delivery Option</label>

                <select id="deliveryOption">
                    <option value="1">Store Pickup - ₱0.00</option>
                    <option value="2">Standard Delivery - ₱80.00</option>
                    <option value="3">Express Delivery - ₱150.00</option>
                </select>
            </div>

            <div id="validationMessage" class="validation"></div>

            <button id="calculateBtn" class="btn">
                Calculate Order
            </button>

            <div id="orderSummary" class="summary">
                <p class="empty-summary">
                    Your order summary will appear here.
                </p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
