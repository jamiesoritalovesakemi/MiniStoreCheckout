<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINI STORE CHECKOUT SYSTEM</title>
</head>

<body>

    <h1>MINI STORE CHECKOUT SYSTEM</h1>

    <form id="checkoutForm">

        <div>
            <label for="customerName">Customer Name</label>
            <input type="text" id="customerName" name="customerName">
        </div>

        <br>

        <div>
            <label for="productCount">Number of Products</label>
            <input type="number" id="productCount" name="productCount" min="1">
        </div>

        <br>

        <div id="productsContainer"></div>

        <br>

        <div>
            <label for="deliveryOption">Delivery Option</label>
            <select id="deliveryOption" name="deliveryOption">
                <option value="1">Store Pickup</option>
                <option value="2">Standard Delivery</option>
                <option value="3">Express Delivery</option>
            </select>
        </div>

        <br>

        <button type="button" id="calculateBtn">
            Calculate Order
        </button>

    </form>

    <br>

    <div id="validationMessage"></div>

    <div id="orderSummary"></div>

    <script src="script.js"></script>

</body>
</html>
